spring:
  application:
    name: telemetry-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cvpm
    username: cvpm
    password: cvpm_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: telemetry-service-group
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:change-me-local-only-please-32-bytes-min}
    expiration-minutes: 60
  risk-service:
    url: ${RISK_SERVICE_URL:http://localhost:8000}
