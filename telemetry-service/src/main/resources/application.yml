spring:
  application:
    name: telemetry-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cvpm
    username: cvpm
    password: cvpm_pw

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      group-id: telemetry-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.cvpm.telemetry.telemetry"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.cvpm.telemetry.telemetry.TelemetryDtos$TelemetryEvent

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:change-me-local-only-please-32-bytes-min}
    expiration-minutes: 60

  risk-service:
    url: ${RISK_SERVICE_URL:http://localhost:8000}